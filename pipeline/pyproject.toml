[project]
name = "beatfall-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "yt-dlp>=2026.1.1",
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4.21"]
# Transcription (piano-cover mapping). basic-pitch itself must be installed with
#   pip install basic-pitch --no-deps
# because its pinned numpy/tensorflow don't support Python 3.13; these are its actual runtime needs.
transcribe = ["onnxruntime>=1.17", "pretty_midi>=0.2.10", "resampy>=0.4", "mir_eval>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
